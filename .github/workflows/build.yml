name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Make app bundle
        run: scripts/make-app.sh
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Lanes.app
          path: build/Lanes.app
