name: Build

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Make app bundle
        run: scripts/make-app.sh
      - name: Check bundle
        run: |
          plutil -lint build/Lanes.app/Contents/Info.plist
          codesign --verify --verbose build/Lanes.app
          test -f build/Lanes.app/Contents/Resources/Lanes.icns
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Lanes.app
          path: build/Lanes.app
